<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pole Scoring - Saisie manuelle lot</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="manual-scoring-body">
    <main class="manual-scoring-shell manual-batch-shell">
      <header class="manual-scoring-header">
        <div>
          <h1>Saisie manuelle en lot</h1>
          <p class="manual-scoring-subtitle">
            <span id="manual-batch-title">Chargement...</span>
          </p>
        </div>
      </header>

      <section id="manual-scoring-error" class="manual-scoring-error" hidden></section>

      <form id="manual-scoring-batch-form" class="manual-scoring-form" hidden>
        <p class="manual-score-warning">Les notes des juges doivent etre entre 0 et 5 (avec demi-points possibles)</p>

        <div class="manual-batch-tabs-stack">
          <div class="manual-batch-tabs-group" id="manual-batch-tabs-main-group">
            <p class="manual-batch-tabs-label">Juges officiels</p>
            <div class="manual-batch-tabs manual-batch-judge-tabs" id="manual-batch-tabs-main" role="tablist" aria-label="Juges officiels"></div>
          </div>
          <div class="manual-batch-tabs-group" id="manual-batch-tabs-shadow-group" hidden>
            <p class="manual-batch-tabs-label">Juges shadows</p>
            <div class="manual-batch-tabs manual-batch-judge-tabs" id="manual-batch-tabs-shadow" role="tablist" aria-label="Juges shadows"></div>
          </div>
        </div>
        <div id="manual-batch-panels"></div>

        <footer class="manual-form-actions">
          <button type="submit" class="manual-submit-button">Enregistrer tout</button>
          <button id="manual-batch-close-button" type="button" class="ghost-button">Fermer la fenetre</button>
        </footer>

        <p id="manual-form-feedback" class="manual-form-feedback" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script type="module" src="/manual-scoring-batch.js"></script>
  </body>
</html>
