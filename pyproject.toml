[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-scoring"
version = "0.1.0"
description = "Application locale de scrutation pour competitions de pole dance (portage desktop Python)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebview>=5.2",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pyinstaller>=6.10"]

[tool.setuptools.packages.find]
where = ["src"]
